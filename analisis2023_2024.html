<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard de Calidad del Aire 2023-2024</title>
    <script src="Datos/datos_dashboard.js"></script>
    <style>
      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        margin: 0;
        padding: 20px;
        background-color: #f4f7f6;
        color: #333;
      }
      h1,
      h2 {
        color: #2c3e50;
        text-align: center;
      }
      .dashboard-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px;
        margin-bottom: 30px;
      }
      .card {
        background: white;
        padding: 20px;
        border-radius: 8px;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
      }
      .full-width {
        grid-column: 1 / -1;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 15px;
      }
      th,
      td {
        border: 1px solid #ddd;
        padding: 8px;
        text-align: center;
      }
      th {
        background-color: #34495e;
        color: white;
      }
      select {
        padding: 10px;
        font-size: 16px;
        margin-bottom: 15px;
        width: 100%;
      }
      @media (max-width: 768px) {
        .dashboard-grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <h1>Tablero de Análisis de Calidad del Aire</h1>

    <div class="dashboard-grid">
      <!-- Gráfica Mensual Contaminantes -->
      <div class="card full-width">
        <h2>Comparación Mensual: PM10 y PM2.5 (Promedio)</h2>
        <canvas id="monthlyChart"></canvas>
      </div>

      <!-- Gráfica O3 y Temperatura -->
      <div class="card">
        <h2>Relación O3 (Máx) y Temperatura Mensual</h2>
        <canvas id="o3TempChart"></canvas>
      </div>

      <!-- Análisis de Días Críticos (Interactivo) -->
      <div class="card">
        <h2>Análisis Horario: Días Críticos</h2>
        <select id="criticalDaySelect">
          <option value="">Selecciona un día crítico...</option>
        </select>
        <canvas id="criticalChart"></canvas>
      </div>

      <!-- Tabla Mensual -->
      <div class="card full-width">
        <h2>Desglose Mensual Consolidado</h2>
        <table id="monthlyTable">
          <thead>
            <tr>
              <th>Año</th>
              <th>Mes</th>
              <th>O3 Máx (ppm)</th>
              <th>CO Máx (ppm)</th>
              <th>PM10 Promedio (µg/m³)</th>
              <th>PM2.5 Promedio (µg/m³)</th>
              <th>Temp Promedio (°C)</th>
            </tr>
          </thead>
          <tbody>
            <!-- Los datos se insertarán dinámicamente aquí -->
          </tbody>
        </table>
      </div>
    </div>

    <!-- Cargar los datos -->
    <script src="/Datos/datos_dashboard.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        if (!window.DATA_DASHBOARD) {
          alert("No se encontró DATA_DASHBOARD. Verifica datos_dashboard.js");
          return;
        }

        const data = window.DATA_DASHBOARD;
        const years = Object.keys(data);
        const monthsLabel = [
          "Ene",
          "Feb",
          "Mar",
          "Abr",
          "May",
          "Jun",
          "Jul",
          "Ago",
          "Sep",
          "Oct",
          "Nov",
          "Dic",
        ];

        // 1. Preparar datos para gráficos mensuales
        const datasetsPM10 = [];
        const datasetsPM25 = [];
        let allDays = [];

        years.forEach((year, index) => {
          const meses = data[year].meses;
          const color =
            index === 0 ? "rgba(52, 152, 219, 0.7)" : "rgba(231, 76, 60, 0.7)";

          // Llenar tabla mensual
          const tbody = document.querySelector("#monthlyTable tbody");
          meses.forEach((m) => {
            const row = `<tr>
                        <td>${year}</td>
                        <td>${monthsLabel[m.mes - 1]}</td>
                        <td>${m.O3_max ? m.O3_max.toFixed(3) : "-"}</td>
                        <td>${m.CO_max ? m.CO_max.toFixed(3) : "-"}</td>
                        <td>${m.PM10_mean ? m.PM10_mean.toFixed(1) : "-"}</td>
                        <td>${m.PM25_mean ? m.PM25_mean.toFixed(1) : "-"}</td>
                        <td>${m.Temp_mean ? m.Temp_mean.toFixed(1) : "-"}</td>
                    </tr>`;
            tbody.innerHTML += row;
          });

          // Preparar series para PM10 y PM2.5
          datasetsPM10.push({
            label: `PM10 Promedio ${year}`,
            data: meses.map((m) => m.PM10_mean),
            backgroundColor: color,
            borderColor: color.replace("0.7", "1"),
            borderWidth: 1,
          });

          // Recopilar días críticos para el selector
          if (data[year].dias_criticos) {
            allDays = allDays.concat(data[year].dias_criticos);
          }
        });

        // 2. Gráfica de Comparación Mensual (PM10)
        new Chart(document.getElementById("monthlyChart"), {
          type: "bar",
          data: { labels: monthsLabel, datasets: datasetsPM10 },
          options: {
            responsive: true,
            scales: {
              y: {
                beginAtZero: true,
                title: { display: true, text: "Concentración (µg/m³)" },
              },
            },
          },
        });

        // 3. Gráfica de O3 vs Temperatura (Solo el primer año disponible para mantener legibilidad)
        const yearBase = years[0];
        const o3Data = data[yearBase].meses.map((m) => m.O3_max);
        const tempData = data[yearBase].meses.map((m) => m.Temp_mean);

        new Chart(document.getElementById("o3TempChart"), {
          type: "line",
          data: {
            labels: monthsLabel,
            datasets: [
              {
                label: `O3 Máx ${yearBase}`,
                data: o3Data,
                borderColor: "rgba(155, 89, 182, 1)",
                yAxisID: "y",
              },
              {
                label: `Temp Promedio ${yearBase}`,
                data: tempData,
                borderColor: "rgba(241, 196, 15, 1)",
                yAxisID: "y1",
              },
            ],
          },
          options: {
            responsive: true,
            scales: {
              y: {
                type: "linear",
                position: "left",
                title: { display: true, text: "O3 (ppm)" },
              },
              y1: {
                type: "linear",
                position: "right",
                title: { display: true, text: "Temperatura (°C)" },
                grid: { drawOnChartArea: false },
              },
            },
          },
        });

        // 4. Lógica de Días Críticos (Selector y Gráfica Horaria)
        const select = document.getElementById("criticalDaySelect");
        allDays.forEach((day, index) => {
          const option = document.createElement("option");
          option.value = index;
          option.text = `${day.fecha} (O3 Max: ${day.O3_max}, PM10 Max: ${day.PM10_max})`;
          select.appendChild(option);
        });

        let criticalChartInfo = null;

        select.addEventListener("change", (e) => {
          if (criticalChartInfo) criticalChartInfo.destroy();
          const val = e.target.value;
          if (val === "") return;

          const dayData = allDays[val].horas;
          const hours = dayData.map((h) => `${h.HOUR}:00`);
          const pm10H = dayData.map((h) => h.PM10);
          const pm25H = dayData.map((h) => h["PM2.5"]);
          const o3H = dayData.map((h) => h.O3 * 1000); // Escalado para visualización

          criticalChartInfo = new Chart(
            document.getElementById("criticalChart"),
            {
              type: "line",
              data: {
                labels: hours,
                datasets: [
                  {
                    label: "PM10",
                    data: pm10H,
                    borderColor: "rgba(231, 76, 60, 1)",
                  },
                  {
                    label: "PM2.5",
                    data: pm25H,
                    borderColor: "rgba(46, 204, 113, 1)",
                  },
                  {
                    label: "O3 (x1000)",
                    data: o3H,
                    borderColor: "rgba(52, 152, 219, 1)",
                  },
                ],
              },
              options: {
                responsive: true,
                scales: { y: { beginAtZero: true } },
              },
            },
          );
        });
      });
    </script>
  </body>
</html>
